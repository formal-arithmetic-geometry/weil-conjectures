# See https://github.com/mathlib-initiative/formalization.yaml

version: "v0.4"

project:
  name: "Weil conjectures in Lean 4"
  description: >-
    A Lean 4 / Mathlib formalization of the Weil conjectures for smooth, proper,
    geometrically irreducible varieties over a finite field: rationality of the zeta
    function, the factorisation into integer polynomials P_0, ..., P_{2d}, the functional
    equation, and the Riemann hypothesis |α| = q^{i/2} for the inverse roots of P_i.
    The proof follows the ℓ-adic route: étale and pro-étale six-functor formalism,
    constructible and Weil sheaves with ℚ̄_ℓ coefficients, proper and smooth base change,
    smooth purity and Poincaré duality, the Grothendieck–Lefschetz trace formula, and
    Deligne's Weil II weight theory via the Fourier-transform route of Laumon and Katz.
    The headline statements are stated purely arithmetically, in terms of point counts
    and integer polynomials.
  authors:
    - "Bin Dong"
    - "Nailin Guan"
    - "Jiedong Jiang"
    - "Ruochuan Liu"
    - "Christian Merten"
    - "Xiangyu Pan"
    - "Tingxiao Shi"
    - "Bin Wu"
    - "Edison Xie"
    - "Wei Yang"
  # with AI agents (Anthropic Claude models) orchestrated by the authors; see `automation`
  responsible_maintainers:
    - "Christian Merten"
  license: "Apache-2.0"   # as declared in the source file headers

