    conjectures (`weil_conjectures`: factorisation, functional equation, integrality,
    Riemann hypothesis), plus the lean-eval formulation in terms of point counts and
    multisets of Frobenius eigenvalues. The complete development is on `master`; its
    `WeilConjectures/` library is the Lean v4.35.0-rc3 port (statements unchanged) of the independently verified commit 91ebbc09a7
    (`master` adds only the comparator files `Comparator/LeanEvalWeil/` and drops the unused
    `checkdecls` dependency).
  # Files containing `sorry`, all outside the dependency closure of the main theorems
  # (checked with `#print axioms`); none is used below.
  sorry_count: 208
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "AlgebraicGeometry.Scheme.zetaSeries_rational"
      file: "WeilConjectures/Statement.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Comparator/config.json"
      literature_dependencies: []
    - declaration: "AlgebraicGeometry.Scheme.weil_conjectures"
      file: "WeilConjectures/Statement.lean"
      sorry_count: 0   # verified on 91ebbc09a7; `#print axioms` re-run on master 2cf5ba93 (2026-11-06)
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Comparator/config.json"
      literature_dependencies: []
    - declaration: "LeanEval.AlgebraicGeometry.WeilConjectures.weil_conjectures"
      file: "WeilConjectures/LeanEval/WeilConjectures.lean"
      sorry_count: 0   # verified on 91ebbc09a7; `#print axioms` re-run on master 2cf5ba93 (2026-11-06)
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Comparator/config-leaneval.json"
      literature_dependencies: []

automation:
  methods:
    - method: "manual"
      notes: >-
        Statements of the main theorems, the definitions they depend on (Comparator/),
        the blueprint, the overall proof architecture and review of definitions were done
        by the human authors.
    - method: "autonomous"
      models: ["claude-opus-5-5", "earlier Claude Opus models"]
      framework: "Claude Code"
      tool_setup: >-
        Hundreds of parallel Claude Code agents run in Kubernetes pods by an orchestration
        system (Orchestra). The tasks were blueprint nodes, `sorry`s on the main-theorem
        path, review fixes, merge conflicts, performance and memory work. A maintainer
        agent ("Houyi") coordinated queues, merge batches and reviews. A second,
        independent agent team (Bin Wu's bot) worked on separate sections and built merge
        batches on its own cluster. The two teams coordinated on Zulip.
      prompting_notes: >-
        Each task was specified as a blueprint node or named `sorry`, with explicit
        rules: no new axioms, no weakened statements, no coefficient-bundling classes,
        per-file memory and time limits, and statements fixed by the human authors.
  spend_usd: "approximately 80,000 USD"
  notes: >-
    Development started in July 2026. The repository history records over 12,000
    commits, most authored by AI agents. All work landed through pull requests to an
    integration branch, each built with `--wfail` and reviewed by an AI review agent
    before merging. The integration branch was merged into `master` on 2026-11-06.

fidelity:
  divergences: >-
    The main theorems are stated for smooth, proper, geometrically irreducible schemes
    over a finite field, with the zeta function and point counts as in the sources. The
    proof follows the blueprint, with documented deviations. Examples: ℚ̄_ℓ-coefficients
    are modelled in a condensed / pro-étale framework; Q̄_ℓ(1) is defined as the constant
    sheaf twisted by the cyclotomic character; the orientation in smooth purity is
    obtained by descending the trace from the finite field together with base change of
    Rf^! along k₀ → k̄ (reduced to the point case by Verdier duality); and some consumers
    of smooth purity are proved via absolute purity and the Thom isomorphism instead of
    the general purity map. Statements of the headline theorems were never changed to
    accommodate the proof.

review:
  status: "agent-reviewed"
  reviewers: ["Nailin Guan", "AI review agents (per pull request)"]
  notes: >-
    The statements of the main theorems and the definitions in Comparator/ are
    human-written and reviewed; the lean-eval statement is checked verbatim against
    upstream. Each AI-generated pull request was reviewed by an AI review agent, with
    blocking findings fixed before merging. Definitions on the main path were audited for
    degenerate or vacuous formulations. The proof bodies themselves have not been
    reviewed line by line by humans: correctness relies on the Lean kernel, `#print axioms`, and the Comparator check of the
    fixed challenge statements (a full Comparator run has not completed yet). The sorry-free
    development (commit 91ebbc09a7, whose Lean code `master` contains unchanged) was
    built by its producing team (Bin Wu’s cluster) and independently built and audited on
    our own infrastructure (from the shared Lake build cache, i.e. not from scratch): `#print axioms` of all main results shows only
    propext, Classical.choice and Quot.sound, no
    `native_decide`/`implemented_by`/`extern`/`skipKernelTC` is used, and the lean-eval
    statement is verbatim.
    External kernel check: con-ron (`con-ron --verified`, from Lean v4.35.0-rc3) accepted
    all 301418 declarations of the lean4export 3.1.0 export of
    `WeilConjectures.zetaSeries_rational` and `WeilConjectures.weil_conjectures`, run on
    two commits: 8c7f1719cfd4ba1e2e5f3876e86910362faf61e8 (branch
    `sheaf/final-candidate`) and its declaration-pruned variant 8a9124e026
    (`sheaf/final-candidate-pruned`). 8c7f1719cf is an earlier release candidate and an
    ancestor of 91ebbc09a7; con-ron has not been run on 91ebbc09a7 itself.

alignment:
  namespace: "AlgebraicGeometry"
  note: >-
    The mapping of blueprint nodes to Lean declarations is maintained in the blueprint
    repository (LEAN-MAPPING.md) and in the blueprint nodes themselves.
  statements:
    - source: "Weil conjectures: rationality of the zeta function"
      lean: "AlgebraicGeometry.Scheme.zetaSeries_rational"
      module: "WeilConjectures/Statement.lean"
      status: "proved"
    - source: "Weil conjectures: factorisation, functional equation, integrality, Riemann hypothesis"
      lean: "AlgebraicGeometry.Scheme.weil_conjectures"
      module: "WeilConjectures/Statement.lean"
      status: "proved"
      note: "sorry-free; independently verified on 91ebbc09a7 (`WeilConjectures/` identical to master); `#print axioms` re-run on master 2cf5ba93"
    - source: "lean-eval `weil_conjectures` (point counts and Frobenius eigenvalues)"
      lean: "LeanEval.AlgebraicGeometry.WeilConjectures.weil_conjectures"
      module: "WeilConjectures/LeanEval/WeilConjectures.lean"
      status: "proved"
      note: "sorry-free; independently verified on 91ebbc09a7 (`WeilConjectures/` identical to master); `#print axioms` re-run on master 2cf5ba93"

acknowledgements: >-
  This project builds on Mathlib, and in particular on its foundational algebraic
  geometry, developed largely by Andrew Yang together with many other Mathlib
  contributors. Material on localization, derived categories and derived functors was taken from
  Joël Riou's branch `jriou_localization`
  (https://github.com/joelriou/mathlib4/tree/jriou_localization), with attribution in
  the file headers; it lives in `WeilConjectures/FromJoel` (see its README.md).
  We thank the Lean community and the lean-eval maintainers.
