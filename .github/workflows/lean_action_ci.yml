name: Lean Action CI

on:
  # Only the default branch: a push to a branch with an open PR is already
  # covered by the `pull_request` trigger, and building it twice ties up the
  # shared self-hosted runner pool for no benefit.
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# This workflow only checks out and builds the project; it deploys nothing.
permissions:
  contents: read # Read access to repository contents

# One in-flight build per PR (and one per branch for pushes): a superseded
# build is cancelled instead of queueing ahead of everything else on the
# shared runners. Keyed on the PR number when there is one; `github.ref`
# covers `push` and `workflow_dispatch`.
concurrency:
  group: ${{ github.repository }}-lean-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1

      # `lake build` only compiles what the root module transitively reaches, so a
      # source file that nothing imports is invisible to it and `WeilConjectures.lean`
      # can fall out of date with CI still green. `.orchestra/validation.sh` runs this
      # check locally, which so far has been the only way anyone notices.
      #
      # Same job rather than a second one: the toolchain and the Mathlib cache are
      # already in place here, and the check costs a few seconds. `!cancelled()` so a
      # failing build cannot hide import-list drift — the check does not need the
      # project to have compiled. Not `always()`, which would also fire on the runs
      # the `concurrency` block above deliberately cancels.
      #
      # `--lib WeilConjectures` is required, and the hint below deliberately does not
      # repeat the suggestion mk_all prints: bare `lake exe mk_all --git` would also
      # generate root files for the `Definitions`/`Challenge`/`Solution` comparator
      # libraries, whose roots are hand-written under `Comparator/Weil/`.
      - name: Verify every module is listed in the root import file
        if: ${{ !cancelled() }}
        run: |
          lake exe mk_all --lib WeilConjectures --git --check || {
            echo "::error file=WeilConjectures.lean::Out of date. Run 'lake exe mk_all --lib WeilConjectures --git' and commit the result. That form exits 1 when it updates the file, which means it did the work — only the --check form's exit code means failure."
            exit 1
          }
