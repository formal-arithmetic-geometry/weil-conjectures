name: Lean Action CI

on:
  # Only the default branch: a push to a branch with an open PR is already
  # covered by the `pull_request` trigger, and building it twice ties up the
  # shared self-hosted runner pool for no benefit.
  push:
    branches:
      - master
  # Only pull requests into `master`. Agent pull requests into the integration branch
  # `slopmaster2` are built in full with `--wfail` by the maintainer's merge pipeline before
  # they land, so building every push to them here only queued the shared runner for hours
  # in front of `master` pull requests.
  pull_request:
    branches:
      - master
  workflow_dispatch:

# This workflow only checks out and builds the project; it deploys nothing.
permissions:
  contents: read # Read access to repository contents

# One in-flight build per PR (and one per branch for pushes): a superseded
# build is cancelled instead of queueing ahead of everything else on the
# shared runners. Keyed on the PR number when there is one; `github.ref`
# covers `push` and `workflow_dispatch`.
concurrency:
  group: ${{ github.repository }}-lean-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted

    steps:
      # `clean: false`: by default checkout runs `git clean -ffdx`, which deletes
      # `.lake/` and made every run compile the whole project from scratch. Lake's
      # traces decide what is stale, so keeping the build between runs is safe.
      - uses: actions/checkout@v5
        with:
          clean: false

      # elan, the toolchain and the Mathlib cache; the build is the step below.
      # No GitHub cache: the self-hosted runner's workspace survives between
      # runs, and lean-action's GitHub cache tars the whole `.lake` on every
      # run (keyed on the commit, so it never hits).
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-github-cache: false

      # The project's own oleans from the cluster's Lake cache (Garage on the
      # k3s cluster), which holds the builds of `slopmaster2`. A pull request
      # from `slopmaster2` then compiles only what its merge commit changes,
      # instead of every module of the project. Best effort: on a miss the
      # build below simply compiles more.
      - name: Fetch the project's build from the cluster's Lake cache
        continue-on-error: true
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/lake-config.toml"
          cat > "$config" <<'TOML'
          cache.defaultService = "garage"

          [[cache.service]]
          name = "garage"
          kind = "s3"
          artifactEndpoint = "http://13.140.132.28:3900/lake-cache/a"
          revisionEndpoint = "http://13.140.132.28:3900/lake-cache/r"
          TOML
          echo "LAKE_CONFIG=$config" >> "$GITHUB_ENV"
          echo "LAKE_CACHE_DIR=$HOME/.cache/lake" >> "$GITHUB_ENV"
          export LAKE_CONFIG="$config" LAKE_CACHE_DIR="$HOME/.cache/lake"
          # Downloads older than two weeks: what is still needed comes again.
          find "$LAKE_CACHE_DIR" -type f -mtime +14 -delete 2>/dev/null || true
          env -u ELAN_TOOLCHAIN "$(elan which lake)" cache get \
            --repo formal-arithmetic-geometry/weil-conjectures --max-revs 30

      # Four concurrent Lean processes: the algebraic-geometry files peak at
      # about 5.5 GiB each, and the runner VM has 32 GiB. This Lake has no jobs
      # flag; its scheduler runs on Lean's thread pool, which this sizes.
      - name: Build
        env:
          LEAN_NUM_THREADS: "4"
        run: lake build

      # Lake writes a module's `.setup.json` (its import closure, as absolute
      # paths, about 2 MB) just before compiling it and reads it only then.
      # Thousands of them fill the runner's disk.
      - name: Drop the compiler's setup files
        if: always()
        run: find .lake/build -name '*.setup.json' -delete 2>/dev/null || true

      # Same check as `.orchestra/validation.sh`: every tracked `.lean` file
      # under `WeilConjectures/` must be imported by `WeilConjectures.lean`,
      # otherwise it is silently never built. Runs after `lean-action` so that
      # the toolchain and mathlib (which provides `mk_all`) are already in
      # place; `--check` only reports, it does not rewrite the file.
      - name: Check all files are imported
        run: lake exe mk_all --lib WeilConjectures --git --check
