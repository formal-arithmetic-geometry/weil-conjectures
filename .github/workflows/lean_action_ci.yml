name: Lean Action CI

on:
  # Only the default branch: a push to a branch with an open PR is already
  # covered by the `pull_request` trigger, and building it twice ties up the
  # shared self-hosted runner pool for no benefit.
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# This workflow only checks out and builds the project; it deploys nothing.
permissions:
  contents: read # Read access to repository contents

# One in-flight build per PR (and one per branch for pushes): a superseded
# build is cancelled instead of queueing ahead of everything else on the
# shared runners. Keyed on the PR number when there is one; `github.ref`
# covers `push` and `workflow_dispatch`.
concurrency:
  group: ${{ github.repository }}-lean-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1

  # `lakefile.toml` sets `warn.sorry = false`, so a `sorry` produces no warning
  # and the build above passes regardless. This job is the repository's only CI
  # signal that the set of `sorry`s has changed. It needs no Lean toolchain and
  # runs in about a second, so it is kept separate from the build in order to
  # give an independent status check rather than masking or being masked by a
  # build failure.
  sorry-inventory:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v5
      - name: Check that the committed sorry inventory matches the tree
        run: ./scripts/sorry_inventory.sh --check
