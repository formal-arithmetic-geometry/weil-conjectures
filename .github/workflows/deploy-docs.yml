name: Deploy docs to Pages

# Publishes the doc-gen4 documentation a docs run already built and uploaded (its
# `github-pages` artifact), without building anything: `deploy-pages` only deploys an
# artifact of its own run, so the artifact is fetched from that run and handed on.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "The docs run whose github-pages artifact to deploy"
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Fetch the artifact of run ${{ inputs.run_id }}
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: pages

      - name: What it holds
        run: |
          ls -la pages
          tar -tf pages/artifact.tar | wc -l | sed 's/^/files: /'

      - name: Hand it on as this run's Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: pages/artifact.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - id: deployment
        uses: actions/deploy-pages@v4
