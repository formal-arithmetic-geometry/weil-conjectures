name: Blueprint

on:
  push:
    branches:
      - master
  pull_request_target:
    paths:
      - 'blueprint/**'
      - 'WeilConjectures/**'
      - 'Comparator/**'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - '.github/workflows/blueprint.yml'
  workflow_dispatch:

# The deploy jobs push to the `gh-pages` branch
permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-blueprint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build blueprint site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build project
        uses: leanprover/lean-action@v1

      - name: Build blueprint (web + PDF)
        uses: xu-cheng/texlive-action@v2
        with:
          docker_image: ghcr.io/xu-cheng/texlive-full:20250401
          run: |
            apk update
            apk add --update make py3-pip git pkgconfig graphviz graphviz-dev gcc musl-dev
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            git config --global --add safe.directory "$(pwd)"
            python3 -m venv env
            source env/bin/activate
            pip install --upgrade pip requests wheel
            pip install pygraphviz --config-settings="--global-option=build_ext" --config-settings="--global-option=-L/usr/lib/graphviz/" --config-settings="--global-option=-R/usr/lib/graphviz/"
            pip install leanblueprint
            leanblueprint pdf
            leanblueprint web
            mkdir -p _site
            cp -r blueprint/web/. _site/
            cp blueprint/print/print.pdf _site/blueprint.pdf

      # `leanblueprint web` writes the declarations referenced by `\lean{...}`
      # to blueprint/lean_decls.
      - name: Check blueprint declarations exist in the Lean code
        run: ~/.elan/bin/lake exe checkdecls blueprint/lean_decls

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: blueprint-site
          path: _site

  deploy:
    name: Deploy to GitHub Pages (/blueprint)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    # Serialize all jobs that push to gh-pages (across workflows) to avoid
    # racing deployments.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: blueprint-site
          path: _site

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          target-folder: blueprint
          force: false
          commit-message: 'deploy blueprint for ${{ github.sha }}'

  deploy-preview:
    name: Deploy PR preview (/preview/<pr>/blueprint)
    if: github.event_name == 'pull_request_target'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: blueprint-site
          path: _site

      - name: Deploy preview to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          target-folder: preview/${{ github.event.pull_request.number }}/blueprint
          force: false
          commit-message: 'deploy blueprint preview for PR #${{ github.event.pull_request.number }} (${{ github.sha }})'
