name: Blueprint

on:
  push:
    branches:
      - master
  pull_request_target:
    paths:
      - 'blueprint/**'
      - 'WeilConjectures/**'
      - 'Comparator/**'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - '.github/workflows/blueprint.yml'
  workflow_dispatch:

# Default to a read-only token. `build` and `checkdecls` run on
# `pull_request_target`, so they hold *this* repository's token while checking
# out and executing code from the pull request; they must never be able to
# write. Only the deploy jobs, which run no code from the PR, opt in to
# `contents: write` for their push to the `gh-pages` branch.
permissions:
  contents: read

# `pull_request_target` runs in the context of the base branch, so `github.ref`
# is `refs/heads/master` for every PR: keying on it alone would make all PR runs
# and the push-to-master run share one group and cancel each other. The PR
# number is empty for `push`/`workflow_dispatch`, which then fall back to the ref.
concurrency:
  group: ${{ github.repository }}-blueprint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build blueprint site
    runs-on: self-hosted
    steps:
      # The texlive-full image is ~5GB and a stock runner is tight on space.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.0
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout project
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build blueprint (web + PDF)
        uses: xu-cheng/texlive-action@v2
        with:
          docker_image: ghcr.io/xu-cheng/texlive-full:20250401
          run: |
            apk update
            apk add --update make py3-pip git pkgconfig graphviz graphviz-dev gcc musl-dev
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            git config --global --add safe.directory "$(pwd)"
            python3 -m venv env
            source env/bin/activate
            pip install --upgrade pip requests wheel
            pip install pygraphviz --config-settings="--global-option=build_ext" --config-settings="--global-option=-L/usr/lib/graphviz/" --config-settings="--global-option=-R/usr/lib/graphviz/"
            pip install leanblueprint
            leanblueprint pdf
            leanblueprint web
            mkdir -p _site
            cp -r blueprint/web/. _site/
            cp blueprint/print/print.pdf _site/blueprint.pdf

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: blueprint-site
          path: _site

      # Written by `leanblueprint web`: the declarations referenced by
      # `\lean{...}`, checked against the Lean code by the `checkdecls` job.
      - name: Upload declaration list
        uses: actions/upload-artifact@v4
        with:
          name: blueprint-lean-decls
          path: blueprint/lean_decls

  checkdecls:
    name: Check blueprint declarations exist in the Lean code
    # Runs in its own job: the Lean build and the ~5GB texlive image do not
    # both fit on a single runner.
    needs: build
    runs-on: self-hosted
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build project
        uses: leanprover/lean-action@v1

      - name: Download declaration list
        uses: actions/download-artifact@v4
        with:
          name: blueprint-lean-decls
          path: blueprint

      - name: Run checkdecls
        run: ~/.elan/bin/lake exe checkdecls blueprint/lean_decls

  deploy:
    name: Deploy to GitHub Pages (/blueprint)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [build, checkdecls]
    runs-on: self-hosted
    permissions:
      contents: write # Pushes the built site to the `gh-pages` branch.
    # Serialize all jobs that push to gh-pages (across workflows) to avoid
    # racing deployments.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: blueprint-site
          path: _site

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          target-folder: blueprint
          force: false
          commit-message: 'deploy blueprint for ${{ github.sha }}'

  deploy-preview:
    name: Deploy PR preview (/preview/<pr>/blueprint)
    if: github.event_name == 'pull_request_target'
    needs: [build, checkdecls]
    runs-on: self-hosted
    permissions:
      contents: write # Pushes the preview site to the `gh-pages` branch.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: blueprint-site
          path: _site

      - name: Deploy preview to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          target-folder: preview/${{ github.event.pull_request.number }}/blueprint
          force: false
          commit-message: 'deploy blueprint preview for PR #${{ github.event.pull_request.number }} (${{ github.sha }})'
