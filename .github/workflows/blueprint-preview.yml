name: Blueprint preview

# Publishes the blueprint site built by the `Blueprint` workflow for a pull
# request to `gh-pages` under `preview/<pr>/blueprint`.
#
# This is a separate `workflow_run` workflow on purpose. `Blueprint` is
# triggered by `pull_request` and therefore builds untrusted code with a
# read-only token, which cannot push to `gh-pages`. A `workflow_run` workflow
# always runs the definition on the default branch, in the context of the base
# repository, so it can safely be trusted with `contents: write` — as long as it
# never checks out or executes anything from the pull request. It does not: it
# downloads the artifacts the build produced and publishes them, nothing else.
#
# Note that `workflow_run` only fires for the copy of this file on the default
# branch, so changes to it take effect after merging, not on the pull request
# that makes them.

on:
  workflow_run:
    workflows: [Blueprint]
    types:
      - completed

permissions:
  actions: read # download artifacts from the run that triggered this one
  contents: write # push the preview to the `gh-pages` branch

jobs:
  deploy-preview:
    name: Deploy PR preview (/preview/<pr>/blueprint)
    # A successful conclusion means `checkdecls` passed too, which is what the
    # old in-workflow `needs: [build, checkdecls]` guarded.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    # Serialize all jobs that push to gh-pages (across workflows) to avoid
    # racing deployments.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      # Checks out the default branch, never the pull request. Required because
      # the deploy action operates on a git working tree.
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: blueprint-site
          path: _site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Download pull request number
        uses: actions/download-artifact@v4
        with:
          name: blueprint-pr-number
          path: pr
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # The artifact comes from a fork-controlled run, so strip it to digits
      # before it reaches a path or a commit message.
      - name: Read pull request number
        id: pr
        run: |
          number="$(tr -cd '0-9' < pr/pr_number)"
          if [ -z "$number" ]; then
            echo "::error::no pull request number in the blueprint-pr-number artifact"
            exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Deploy preview to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          target-folder: preview/${{ steps.pr.outputs.number }}/blueprint
          force: false
          commit-message: 'deploy blueprint preview for PR #${{ steps.pr.outputs.number }} (${{ github.event.workflow_run.head_sha }})'
