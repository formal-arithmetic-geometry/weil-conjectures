name: Docs (doc-gen4)

# Test of building the doc-gen4 documentation (on the self-hosted big-server runner), so that it can
# be served from GitHub Pages and the blueprint can link Lean names to it. The `deploy` job
# publishes it at https://formal-arithmetic-geometry.github.io/weil-conjectures/.
on:
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "docbuild/**"
  workflow_dispatch:
    inputs:
      threads:
        description: "LEAN_NUM_THREADS for the build and the documentation"
        default: "10"
      deploy_run_id:
        description: "Only deploy the github-pages artifact of this earlier docs run, building nothing"
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-docs-${{ github.ref }}
  cancel-in-progress: true

# The project's build comes from the public Lake cache, exactly as in lean_action_ci.yml.
env:
  LAKE_CACHE_ENDPOINT: https://cache.fuxi.merten.dev/lake-cache
  LAKE_CACHE_REPO: formal-arithmetic-geometry/weil-conjectures

jobs:
  docs:
    if: ${{ !inputs.deploy_run_id }}
    # Our own runner on fuxi (16 vCPU, 40 GiB): it has a C compiler, which doc-gen4's
    # dependencies need and big-server lacks. Self-hosted jobs may run for days, not 6 h.
    runs-on: [self-hosted, fuxi]
    timeout-minutes: 1440
    env:
      THREADS: ${{ inputs.threads || '10' }}
    steps:
      # History, so that `lake cache get` can look for cached revisions behind HEAD.
      # `clean: false`: a long documentation run that fails part-way resumes from Lake's traces
      # on the next run instead of starting again.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50
          clean: false

      # elan, the toolchain and the Mathlib cache.
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-github-cache: false

      # As in lean_action_ci.yml: the build of HEAD's nearest uploaded ancestor, every archive
      # up front, with the toolchain's own `lake` and ELAN_TOOLCHAIN unset so that the revision
      # scope matches the cluster's uploaders.
      - name: Fetch the project's build from the Lake cache
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/lake-config.toml"
          cat > "$config" <<TOML
          cache.defaultService = "fuxi"

          [[cache.service]]
          name = "fuxi"
          kind = "s3"
          artifactEndpoint = "$LAKE_CACHE_ENDPOINT/a"
          revisionEndpoint = "$LAKE_CACHE_ENDPOINT/r"
          TOML
          {
            echo "LAKE_CONFIG=$config"
            echo "LAKE_CACHE_DIR=$GITHUB_WORKSPACE/.lake/cache"
            echo "LAKE_ARTIFACT_CACHE=true"
            echo "LAKE_RESTORE_ARTIFACTS=true"
          } >> "$GITHUB_ENV"
          export LAKE_CONFIG="$config" LAKE_CACHE_DIR="$GITHUB_WORKSPACE/.lake/cache"
          env -u ELAN_TOOLCHAIN "$(elan which lake)" cache get \
            --repo "$LAKE_CACHE_REPO" --max-revs 30

      - name: Restore the cached build in bulk
        run: python3 scripts/ci/bulk_unpack_cache.py .

      # Should compile next to nothing; how much it does compile is part of the test.
      - name: Build the project
        env:
          LEAN_NUM_THREADS: ${{ env.THREADS }}
          LAKE_NO_CACHE: "true"
          LAKE_ARTIFACT_CACHE: "false"
        run: |
          set -o pipefail
          start=$(date +%s)
          lake build WeilConjectures 2>&1 | tee "$RUNNER_TEMP/build.log"
          echo "compiled: $(grep -cE '✔ \[[0-9]+/[0-9]+\] Built ' "$RUNNER_TEMP/build.log") modules in $(( $(date +%s) - start ))s"
          tail -1 "$RUNNER_TEMP/build.log"
          find .lake/build -name '*.setup.json' -delete
          df -h /

      # As for Mathlib's docs: a package requiring doc-gen4 and this repository, with the
      # dependencies (Mathlib and its cached oleans) moved over rather than fetched again.
      # doc-gen4 wants the documented repository to be a git checkout with a remote, which
      # the checkout above is.
      - name: Set up the docs package
        working-directory: docbuild
        run: |
          set -euo pipefail
          cp ../lean-toolchain .
          mkdir -p .lake/packages
          # The root's packages (Mathlib with its oleans, as just fetched) replace any of the
          # same name from an earlier run; doc-gen4 and its own dependencies stay.
          for p in ../.lake/packages/*/; do
            n=$(basename "$p"); rm -rf ".lake/packages/$n"; mv "$p" ".lake/packages/$n"
          done
          if [ -f lake-manifest.json ]; then lake update weil-conjectures; else lake update; fi
          git -C .. status --short | head -5

      # doc-gen4's dependencies (leansqlite, MD4Lean) compile C with whatever `cc` is on the
      # PATH, and big-server has none. Lean's toolchain ships a C compiler with its own
      # headers: `leanc`. Used only when the runner has no `cc` of its own.
      - name: A C compiler for doc-gen4's dependencies
        run: |
          if command -v cc > /dev/null; then
            echo "cc: $(command -v cc)"
          else
            shim="$RUNNER_TEMP/cc-shim"
            mkdir -p "$shim"
            ln -sf "$(dirname "$(elan which lean)")/leanc" "$shim/cc"
            echo "$shim" >> "$GITHUB_PATH"
            echo "cc: $shim/cc -> $(readlink "$shim/cc")"
          fi

      - name: Build doc-gen4
        working-directory: docbuild
        env:
          LAKE_NO_CACHE: "true"
          LAKE_ARTIFACT_CACHE: "false"
        run: lake build doc-gen4

      - name: Generate the documentation
        working-directory: docbuild
        env:
          LAKE_NO_CACHE: "true"
          LAKE_ARTIFACT_CACHE: "false"
          LEAN_NUM_THREADS: ${{ env.THREADS }}
          DOCGEN_SRC: github
          # No "Equations" sections: computing a definition's equation lemmas blew one
          # doc-gen4 process up to 35 GB, and the OOM killer took the job down with it.
          DISABLE_EQUATIONS: "1"
        run: |
          set -o pipefail
          start=$(date +%s)
          # Memory every 10 s, to see how many threads the runner can afford: used memory and the
          # largest doc-gen4 process.
          ( while sleep 10; do
              used=$(free -m | awk '/Mem/{print $3}')
              top=$(ps -eo rss,comm --sort=-rss | awk '$2 ~ /doc-gen4|lean/ {print int($1/1024); exit}')
              echo "$(( $(date +%s) - start )) $used ${top:-0}" >> "$RUNNER_TEMP/mem.log"
              # Any doc-gen4 process over 8 GB, with the module it documents.
              ps -eo rss,args | awk '$1 > 8388608 && /doc-gen4 single/ { $1=$1/1048576; printf "%.1f GiB %s\n", $1, substr($0, index($0, $2), 300) }' >> "$RUNNER_TEMP/big.log"
            done ) &
          sampler=$!
          status=0
          lake build WeilConjectures:docs 2>&1 | tee "$RUNNER_TEMP/docs.log" || status=$?
          echo "jobs by kind: $(grep -oE "Built [A-Za-z]+" "$RUNNER_TEMP/docs.log" | sort | uniq -c | sort -rn | head -5 | tr "\n" " ")"
          kill "$sampler" 2>/dev/null || true
          sort -k2 -n "$RUNNER_TEMP/mem.log" | tail -1 | awk -v t="$THREADS" '{printf "memory: peak used %.1f GiB at %ds; largest process %.1f GiB (threads: %s)\n", $2/1024, $1, $3/1024, t}'
          sort -k3 -n "$RUNNER_TEMP/mem.log" | tail -1 | awk '{printf "        largest process seen %.1f GiB at %ds\n", $3/1024, $1}'
          echo "doc-gen4 processes over 8 GB (if any):"; sort -u "$RUNNER_TEMP/big.log" 2>/dev/null | sort -n | tail -10 || true
          echo "docs built in $(( $(date +%s) - start ))s"
          tail -1 "$RUNNER_TEMP/docs.log"
          exit "$status"

      - name: Measure the documentation
        working-directory: docbuild/.lake/build/doc
        run: |
          du -sh .
          echo "files: $(find . -type f | wc -l), html: $(find . -name '*.html' | wc -l)"
          du -sh -- */ 2>/dev/null | sort -h | tail -12
          df -h /

      - name: Upload for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: docbuild/.lake/build/doc

  # Publishes the artifact the docs job uploaded. On a GitHub-hosted runner: it only hands
  # the artifact to Pages.
  deploy:
    needs: docs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # With `deploy_run_id`: publish what an earlier docs run built, without building anything.
  # `deploy-pages` deploys only an artifact of its own run, so that run's artifact is fetched
  # and handed on.
  deploy-earlier:
    if: ${{ inputs.deploy_run_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Fetch the artifact of run ${{ inputs.deploy_run_id }}
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: ${{ inputs.deploy_run_id }}
          github-token: ${{ github.token }}
          path: pages

      - name: What it holds
        run: |
          ls -la pages
          tar -tf pages/artifact.tar | wc -l | sed 's/^/files: /'

      - name: Hand it on as this run's Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: pages/artifact.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - id: deployment
        uses: actions/deploy-pages@v4
