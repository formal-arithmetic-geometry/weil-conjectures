name = "weil-conjectures"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["WeilConjectures", "Challenge", "Solution", "Sheaf", "TargetsCheck", "SheafChallenge"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
backward.isDefEq.respectTransparency = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
maxSynthPendingDepth = 3
# Switch off warnings generated by `sorry`
warn.sorry = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[require]]
name = "proetale"
git = "https://github.com/Thmoas-Guan/slopetale_fork"
rev = "weil-conjectures-dependency-4.33.1"

# Provides `lake exe checkdecls` for checking externally supplied declaration
# lists. The blueprint submodule uses its own Lake package and checking tool;
# see blueprint/README.md.
[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[lean_lib]]
name = "WeilConjectures"

# Comparator (leanprover/comparator) challenge/solution pair for the Weil conjectures,
# see Comparator/config.json. The `Definitions` library contains the mathlib-only
# definitions shared by challenge and solution.
# The modules are rooted at `Weil.*` so that they do not clash with the identically
# named comparator modules of the `proetale` dependency.
[[lean_lib]]
name = "Definitions"
srcDir = "Comparator"
roots = ["Weil.Definitions"]

[[lean_lib]]
name = "Challenge"
srcDir = "Comparator"
roots = ["Weil.Challenge"]

[[lean_lib]]
name = "Solution"
srcDir = "Comparator"
roots = ["Weil.Solution"]

# SHEAF (stage 3, prepared on branch stage3-prep, not switched): the project's own modules, formerly the package
# sheaf-weil, as a second library root of this package, so that SHEAF_LIB="WeilConjectures Sheaf" and an upstream
# module may import Sheaf.*. `autoImplicit = false` was a package option of sheaf-weil; kept for this library only.
[[lean_lib]]
name = "Sheaf"
globs = ["Sheaf.+"]
leanOptions = { autoImplicit = false }

# stages/2-statements.md §4: imports the target modules and nothing else.
[[lean_lib]]
name = "TargetsCheck"
roots = ["TargetsCheck"]

# stages/2-statements.md §4: the target statements verbatim (the library name Challenge is upstream's Weil.Challenge).
[[lean_lib]]
name = "SheafChallenge"
roots = ["Challenge"]
