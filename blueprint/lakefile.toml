# The Verso blueprint is a self-contained Lake package nested in the
# weil-conjectures repository. It deliberately does not touch the top-level
# `lakefile.toml`: the main project builds exactly as before, and the
# blueprint is built separately from inside this directory.

name = "WeilConjecturesBlueprint"
precompileModules = false
defaultTargets = ["WeilConjecturesBlueprint"]

[leanOptions]
experimental.module = true
verso.blueprint.foldCodeBlocks = true

# Dependency resolution notes:
#
# * VersoBlueprint publishes no release tags; it maintains one branch per Lean
#   toolchain (`v4.28.0`, ..., `v4.32.0`). `rev = "v4.32.0"` selects the branch
#   matching `lean-toolchain`, and `lake-manifest.json` locks the exact commit,
#   so the effective pin is a fixed revision.
#
# * VersoBlueprint and Mathlib pin different versions of some shared
#   dependencies (e.g. ProofWidgets). A later `require` wins, so the parent
#   project is listed after `VersoBlueprint`; consequently the versions pinned
#   by the parent's Mathlib are used and `lake exe cache get` keeps finding
#   Mathlib's prebuilt cache instead of triggering a full Mathlib rebuild.

[[require]]
name = "VersoBlueprint"
git = "https://github.com/leanprover/verso-blueprint"
rev = "v4.32.0"

[[require]]
name = "weil-conjectures"
path = ".."

[[lean_lib]]
name = "WeilConjecturesBlueprint"

[[lean_exe]]
name = "blueprint-gen"
root = "WeilConjecturesBlueprintMain"
