name = "weil-conjectures"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["WeilConjectures", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
backward.isDefEq.respectTransparency = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
maxSynthPendingDepth = 3
# Switch off warnings generated by `sorry`
warn.sorry = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

[[require]]
name = "proetale"
git = "https://github.com/Thmoas-Guan/slopetale_fork"
rev = "weil-conjecture-dependency"

# The two halves of the blueprint <-> Lean contract, both run against
# `blueprint/lean_decls` (written by `leanblueprint web`), which lists the
# declarations referenced by `\lean{...}` in blueprint/src:
#
#   lake exe checkdecls   -- does the declaration exist?
#   lake exe checkaxioms  -- is it actually proved, or is it closed by `sorry`?
#
# Neither subsumes the other. `checkdecls` cannot see a `sorry`, and since
# `warn.sorry = false` above neither can `lake build`; `checkaxioms` deliberately
# does not fail on a name that is missing, because that is `checkdecls`' question.
[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[lean_exe]]
name = "checkaxioms"
srcDir = "scripts"
root = "checkaxioms"
supportInterpreter = true

[[lean_lib]]
name = "WeilConjectures"

# Comparator (leanprover/comparator) challenge/solution pair for the Weil conjectures,
# see Comparator/config.json. The `Definitions` library contains the mathlib-only
# definitions shared by challenge and solution.
# The modules are rooted at `Weil.*` so that they do not clash with the identically
# named comparator modules of the `proetale` dependency.
[[lean_lib]]
name = "Definitions"
srcDir = "Comparator"
roots = ["Weil.Definitions"]

[[lean_lib]]
name = "Challenge"
srcDir = "Comparator"
roots = ["Weil.Challenge"]

[[lean_lib]]
name = "Solution"
srcDir = "Comparator"
roots = ["Weil.Solution"]
