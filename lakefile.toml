name = "weil-conjectures"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["WeilConjectures", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
backward.isDefEq.respectTransparency = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
maxSynthPendingDepth = 3
# Switch off warnings generated by `sorry`
warn.sorry = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "b63f6e8a68d220e3b3bc4f3792bb53650d375f24"

# Provides `lake exe checkdecls` for checking externally supplied declaration
# lists. The blueprint (formal-arithmetic-geometry/weil-conjectures-blueprint)
# uses its own Lake package and checking tool.
[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[lean_lib]]
name = "WeilConjectures"

# Comparator (leanprover/comparator) challenge/solution pair for the Weil conjectures,
# see Comparator/config.json. The `Definitions` library contains the mathlib-only
# definitions shared by challenge and solution.
# The modules are rooted at `Weil.*` (historically to avoid clashes with the identically
# named comparator modules of the former `proetale` dependency, dropped in the v4.35 bump).
[[lean_lib]]
name = "Definitions"
srcDir = "Comparator"
roots = ["Weil.Definitions"]

[[lean_lib]]
name = "Challenge"
srcDir = "Comparator"
roots = ["Weil.Challenge"]

[[lean_lib]]
name = "Solution"
srcDir = "Comparator"
roots = ["Weil.Solution"]
