name = "weil-conjectures"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["WeilConjectures", "EditMathlib", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
backward.isDefEq.respectTransparency = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
maxSynthPendingDepth = 3
# Switch off warnings generated by `sorry`
warn.sorry = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[require]]
name = "proetale"
git = "https://github.com/Thmoas-Guan/slopetale_fork"
rev = "weil-conjectures-dependency-4.33.1"

# Provides `lake exe checkdecls`, run locally against `blueprint/lean_decls`
# (written by `leanblueprint web`) to check that the declarations referenced
# by `\lean{...}` in blueprint/src actually exist.
[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[lean_lib]]
name = "WeilConjectures"

# Ports of the `Mathlib.Algebra.Homology.DerivedCategory.*` files onto the opaque
# `DerivedCategory'` wrapper, see `WeilConjectures/EditMathlib.lean`. This is a separate
# library because a ported module declares the same names as the mathlib module it replaces,
# and so must not be imported together with it.
[[lean_lib]]
name = "EditMathlib"
roots = ["WeilConjectures.EditMathlib"]

# Comparator (leanprover/comparator) challenge/solution pair for the Weil conjectures,
# see Comparator/config.json. The `Definitions` library contains the mathlib-only
# definitions shared by challenge and solution.
# The modules are rooted at `Weil.*` so that they do not clash with the identically
# named comparator modules of the `proetale` dependency.
[[lean_lib]]
name = "Definitions"
srcDir = "Comparator"
roots = ["Weil.Definitions"]

[[lean_lib]]
name = "Challenge"
srcDir = "Comparator"
roots = ["Weil.Challenge"]

[[lean_lib]]
name = "Solution"
srcDir = "Comparator"
roots = ["Weil.Solution"]
