name = "weil-conjectures"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["WeilConjectures", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
backward.isDefEq.respectTransparency = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
maxSynthPendingDepth = 3
# Switch off warnings generated by `sorry`
warn.sorry = false

[[require]]
name = "VersoBlueprint"
git = "https://github.com/leanprover/verso-blueprint"
rev = "v4.32.0"

# Keep mathlib last so that its pinned transitive dependencies (in particular
# proofwidgets) take precedence and `lake exe cache get` works.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

[[lean_lib]]
name = "WeilConjectures"

# Comparator (leanprover/comparator) challenge/solution pair for the Weil conjectures,
# see Comparator/config.json. The `Definitions` library contains the mathlib-only
# definitions shared by challenge and solution.
[[lean_lib]]
name = "Definitions"
srcDir = "Comparator"

[[lean_lib]]
name = "Challenge"
srcDir = "Comparator"

[[lean_lib]]
name = "Solution"
srcDir = "Comparator"

# The Verso blueprint of the project, see the blueprint/ directory.
# Render with `scripts/build_blueprint.sh`; the site is written to
# _out/site/html-multi/.
[[lean_lib]]
name = "Blueprint"
srcDir = "blueprint"
